name: Weekly NASCAR Cup Results

on:
  # Run every Monday at 10:00 UTC (6:00 AM EDT / 5:00 AM EST)
  schedule:
    - cron: '0 10 * * 1'

  # Allow manual runs from the Actions tab
  workflow_dispatch:

jobs:
  fetch-results:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run NASCAR results script
        run: python nascar_results.py

      - name: Commit and push results (if any new files)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Only commit if new CSV files were created
          if [ -n "$(git status --porcelain nascar_results/)" ]; then
            git add nascar_results/
            git commit -m "NASCAR results $(date +%Y-%m-%d)"
            git push
          else
            echo "No new results to commit"
          fi
