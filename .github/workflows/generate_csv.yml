name: Generate NASCAR Race Results CSV

on:
  schedule:
    # Runs automatically every Monday morning at 6:00 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run CSV Generator
        run: python generate_csv.py

      - name: Commit and push generated CSV
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add race_results.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update: race_results.csv" && git push)
